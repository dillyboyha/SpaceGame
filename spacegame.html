<!DOCTYPE html>
<html>
    <head>
        <title>Game</title>
        <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #111;
        font-family: monospace;
        color: white;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    #gameWrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        /* This keeps the stretched pixels sharp instead of blurry */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    #score {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 24px;
        z-index: 10;
    }

    #highScore {
        position: absolute;
        top: 50px;
        left: 20px;
        font-size: 16px;
        color: #aaa;
        z-index: 10;
    }
    #fpsCounter {
        position: absolute;
        top: 6px;
        left: 20px;
        font-size: 12px;
        color: #aaa;
        z-index: 10;
    }
</style>
    </head>
    <body>
        <div id="score">Score: 0</div>
        <div id="highScore">Best: 0</div>
        <div id="fpsCounter">Fps: 0</div>
        <div id="gameWrapper">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
        </div>

        <script src="game.js"></script>
    </body>
</html>
